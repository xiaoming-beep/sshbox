[workspace]
members = ["crates/sshcore", "crates/daemon", "crates/cli", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["ssh-box"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "net"] }
russh = "=0.45.0"
# keyring 2.x: the Windows credential store is built in on Windows (no feature flag).
keyring = "2"
dirs = "5"
async-trait = "0.1"
rand = "0.8"
vt100 = "0.15"
russh-sftp = "3"
axum = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
# 连接/文件夹/日志统一存 SQLite；bundled 编译进 libsqlite3，免装运行时
rusqlite = { version = "0.32", features = ["bundled"] }
