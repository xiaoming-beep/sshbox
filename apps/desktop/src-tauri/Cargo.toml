[package]
name = "sshbox-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "SSH Box 桌面端"

[lib]
name = "sshbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
sshcore = { path = "../../../crates/sshcore" }
sshbox-daemon = { path = "../../../crates/daemon" }
base64 = "0.22"
